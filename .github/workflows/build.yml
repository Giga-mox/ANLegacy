name: Build custom IPA
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Home screen name
        default: ANLegacy
        required: true
      bundle_id:
        description: Bundle identifier
        default: com.gigamox.anlegacy
        required: true
      icon_path:
        description: Optional square PNG path in this repository
        default: ''
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      THEOS: ${{ github.workspace }}/.build-theos
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip git libxml2 libtinfo6 xz-utils python3-pil
      - name: Install Theos and SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain"
          curl -fL --retry 3 https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          cp -a "$RUNNER_TEMP/sdks/iPhoneOS11.2.sdk" "$THEOS/sdks/"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "$THEOS/toolchain/linux/iphone/bin" >> "$GITHUB_PATH"
      - name: Compile arm64
        run: make package ARCHS=arm64 FINALPACKAGE=1
      - name: Package and customize
        env:
          APP_NAME: ${{ inputs.app_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          ICON_PATH: ${{ inputs.icon_path }}
        run: |
          mkdir -p dist
          deb="$(find packages -name '*.deb' -print -quit)"
          test -n "$deb"
          python3 deb_to_ipa.py "$deb" "$RUNNER_TEMP/base.ipa"
          # Preserve the original Mach-O SDK, without the upstream modern-device patch.
          python3 - "$RUNNER_TEMP/base.ipa" "$RUNNER_TEMP/arm64.ipa" <<'PY'
          import zipfile, plistlib
          import sys
          with zipfile.ZipFile(sys.argv[1]) as src, zipfile.ZipFile(sys.argv[2], 'w', zipfile.ZIP_DEFLATED) as dst:
              for entry in src.infolist():
                  data = src.read(entry)
                  if entry.filename.count('/') == 2 and entry.filename.endswith('.app/Info.plist'):
                      info = plistlib.loads(data)
                      info['MinimumOSVersion'] = '11.0'
                      info['UIRequiredDeviceCapabilities'] = ['arm64']
                      data = plistlib.dumps(info)
                  dst.writestr(entry, data)
          PY
          args=()
          if [[ -n "$ICON_PATH" ]]; then
            icon="$(realpath "$ICON_PATH")"
            [[ "$icon" == "$GITHUB_WORKSPACE/"* ]]
            args+=(--icon "$icon")
          fi
          python3 customize_ipa.py "$RUNNER_TEMP/arm64.ipa" dist/ANLegacy.ipa --name "$APP_NAME" --bundle-id "$BUNDLE_ID" "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: ANLegacy-IPA
          path: dist/ANLegacy.ipa
          if-no-files-found: error
